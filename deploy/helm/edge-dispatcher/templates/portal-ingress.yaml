apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge-portal
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge-portal
                port:
                  number: 80
