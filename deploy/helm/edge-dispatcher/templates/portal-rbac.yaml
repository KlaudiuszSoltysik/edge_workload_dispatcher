apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-portal
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edge-portal-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["edge.platform"]
    resources: ["workspaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: edge-portal-binding
subjects:
  - kind: ServiceAccount
    name: edge-portal
    namespace: default
roleRef:
  kind: ClusterRole
  name: edge-portal-role
  apiGroup: rbac.authorization.k8s.io
