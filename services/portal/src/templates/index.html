<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edge Workload Dispatcher</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        margin: 2rem;
        background: #0f172a;
        color: #f8fafc;
      }
      .card {
        background: #1e293b;
        padding: 1.5rem;
        border-radius: 8px;
        margin-bottom: 1.5rem;
        border: 1px solid #334155;
      }
      .form-group {
        display: inline-block;
        margin-right: 1.5rem;
        margin-bottom: 1rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        color: #94a3b8;
        font-size: 0.9rem;
      }
      select,
      input {
        background: #0f172a;
        color: #f8fafc;
        border: 1px solid #334155;
        padding: 0.5rem;
        border-radius: 4px;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background: #1d4ed8;
      }
      button.danger {
        background: #dc2626;
      }
      button.danger:hover {
        background: #b91c1c;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.75rem;
        border-bottom: 1px solid #334155;
      }
      th {
        color: #94a3b8;
      }
      a.term-btn {
        display: inline-block;
        background: #059669;
        color: #fff;
        text-decoration: none;
        padding: 0.4rem 0.8rem;
        border-radius: 4px;
        font-weight: 600;
        font-size: 0.9rem;
      }
      a.term-btn:hover {
        background: #047857;
      }
    </style>
  </head>
  <body>
    <h1>Edge Compute Dashboard</h1>

    <div class="card">
      <h3>Provision New Instance</h3>
      <div class="form-group">
        <label>Available GPU Pool:</label>
        <select id="gpuModel" onchange="updateMaxGpuCount()"></select>
      </div>
      <div class="form-group">
        <label>GPU Count:</label>
        <input
          type="number"
          id="gpuCount"
          value="1"
          min="1"
          max="1"
          style="width: 80px"
        />
      </div>
      <div class="form-group">
        <label>Disk (GB):</label>
        <input
          type="number"
          id="diskGb"
          value="5"
          min="1"
          max="50"
          style="width: 80px"
        />
      </div>
      <div class="form-group">
        <button onclick="provisionTask()" style="margin-top: 1.4rem">
          Launch Instance
        </button>
      </div>
    </div>

    <div class="card">
      <h3>Active Workloads</h3>
      <table>
        <thead>
          <tr>
            <th>Task Name</th>
            <th>Model</th>
            <th>GPUs</th>
            <th>Status</th>
            <th>Node</th>
            <th>Terminal</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tasksBody"></tbody>
      </table>
    </div>

    <script>
      let availableHardware = [];

      async function loadHardware() {
        const res = await fetch("/api/v1/hardware/available");
        const data = await res.json();
        availableHardware = data.available_hardware;

        const select = document.getElementById("gpuModel");
        const currentSelection = select.value;
        select.innerHTML = "";

        if (availableHardware.length === 0) {
          const opt = document.createElement("option");
          opt.textContent = "No hardware available";
          opt.disabled = true;
          select.appendChild(opt);
          document.getElementById("gpuCount").max = 1;
          return;
        }

        availableHardware.forEach((hw) => {
          const opt = document.createElement("option");
          opt.value = hw.gpu_model;
          opt.dataset.max = hw.gpu_free;
          opt.textContent = `${hw.gpu_model.toUpperCase()} (Available: ${hw.gpu_free} on ${hw.node})`;
          select.appendChild(opt);
        });

        if (
          currentSelection &&
          select.querySelector(`option[value="${currentSelection}"]`)
        ) {
          select.value = currentSelection;
        }
        updateMaxGpuCount();
      }

      function updateMaxGpuCount() {
        const select = document.getElementById("gpuModel");
        const countInput = document.getElementById("gpuCount");
        if (select.options.length > 0 && !select.options[0].disabled) {
          const maxFree = select.options[select.selectedIndex].dataset.max;
          countInput.max = maxFree;
          if (parseInt(countInput.value) > parseInt(maxFree)) {
            countInput.value = maxFree;
          }
        }
      }

      async function loadTasks() {
        try {
          const res = await fetch("/api/v1/tasks");
          const tasks = await res.json();
          const tbody = document.getElementById("tasksBody");
          tbody.innerHTML = "";

          for (const task of tasks) {
            const name = task.metadata.name;
            const model = task.spec.gpuModel;
            const count = task.spec.gpuCount || 1;

            // Handle both flat and Kopf-nested status structures
            const statusObj = task.status
              ? task.status.create_task || task.status
              : null;
            const status = statusObj ? statusObj.status : "Pending";
            const node = statusObj ? statusObj.allocatedNode : "Pending";
            const termUrl = statusObj ? statusObj.webTerminalUrl : null;

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${name}</td>
                <td>${model.toUpperCase()}</td>
                <td>${count}</td>
                <td>${status}</td>
                <td>${node}</td>
                <td>${termUrl ? `<a class="term-btn" href="${termUrl}" target="_blank">Open Console</a>` : "Initializing..."}</td>
                <td><button class="danger" onclick="deleteTask('${name}')">Terminate</button></td>
            `;
            tbody.appendChild(row);
          }
        } catch (err) {
          console.error("Failed to load tasks:", err);
        }
      }

      async function deleteTask(name) {
        if (!confirm(`Are you sure you want to terminate ${name}?`)) return;

        try {
          const res = await fetch(`/api/v1/tasks/${name}`, {
            method: "DELETE",
          });
          if (!res.ok) {
            const errorData = await res.json();
            alert(`Error deleting task: ${errorData.detail || res.statusText}`);
            return;
          }
          setTimeout(() => {
            loadTasks();
            loadHardware();
          }, 1500);
        } catch (err) {
          alert(`Request failed: ${err}`);
        }
      }

      async function provisionTask() {
        const gpuModel = document.getElementById("gpuModel").value;
        const gpuCount = parseInt(
          document.getElementById("gpuCount").value,
          10,
        );
        const diskGb = parseInt(document.getElementById("diskGb").value, 10);

        if (!gpuModel) return alert("No hardware available!");

        await fetch(
          `/api/v1/tasks/provision?gpu_model=${gpuModel}&gpu_count=${gpuCount}&disk_gb=${diskGb}`,
          { method: "POST" },
        );
        setTimeout(() => {
          loadTasks();
          loadHardware();
        }, 1500);
      }

      async function deleteTask(name) {
        await fetch(`/api/v1/tasks/${name}`, { method: "DELETE" });
        setTimeout(() => {
          loadTasks();
          loadHardware();
        }, 1500);
      }

      // Initial load
      loadHardware();
      loadTasks();

      // Background refresh
      setInterval(loadTasks, 5000);
      setInterval(loadHardware, 10000);
    </script>
  </body>
</html>
