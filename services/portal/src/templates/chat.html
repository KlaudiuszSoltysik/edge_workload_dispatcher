{% extends "base.html" %}

{% block title %}Chat{% endblock %}

{% block content %}
<h1>Model Interaction</h1>

<div class="card">
  <form method="post" action="/chat">
    <div class="form-group">
      <label for="task_type">Model Type:</label>
      <select name="task_type" id="task_type" class="form-control">
        <option value="llm">LLM</option>
        <option value="vision">Vision</option>
        <option value="audio">Audio</option>
      </select>
    </div>

    <div class="form-group full-width">
      <label for="prompt">Prompt:</label>
      <textarea
        name="prompt"
        id="prompt"
        rows="4"
        class="form-control"
        required
      >{{ last_prompt | default('') }}</textarea>
    </div>

    <div class="form-group full-width">
      <button type="submit" class="btn">Submit Task</button>
    </div>
  </form>
</div>

{% if result %}
<div class="card">
  <h3>Result:</h3>
  <pre>{{ result }}</pre>
</div>
{% endif %}
{% endblock %}
