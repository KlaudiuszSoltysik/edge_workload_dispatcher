apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspaces.edge.platform
spec:
  group: edge.platform
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    singular: workspace
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                  default: "ubuntu-ssh:latest"
                gpuModel:
                  type: string
                gpuCount:
                  type: integer
                  minimum: 1
                diskGb:
                  type: integer
                  minimum: 1
                  default: 5
              required:
                - gpuModel
                - gpuCount
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
